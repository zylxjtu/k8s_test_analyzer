services:
  k8s-test-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FASTMCP_PORT: ${FASTMCP_PORT:-8978}
    container_name: k8s-test-analyzer
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"  # Run as host user; defaults to root (0:0) if not specified
    network_mode: host  # Use host networking for better performance
    volumes:
      - ${PROJECTS_ROOT}:/projects
      - ${PROJECTS_ROOT}/container_cache:/app/.cache  # Cache folder (works for both root and non-root)
      - ./debugging_guides.yaml:/app/debugging_guides.yaml:ro  # Live-updatable debugging guides
    environment:
      - HOME=/app  # Set HOME for cache directory to work with any user
      - FASTMCP_PORT=${FASTMCP_PORT:-8978}
      - PROJECTS_ROOT=/projects
      - DEFAULT_DASHBOARD=${DEFAULT_DASHBOARD:-sig-windows-signal}
      - FOLDERS_TO_INDEX=${FOLDERS_TO_INDEX}  # Use env variable for folders
      - ADDITIONAL_IGNORE_DIRS=${ADDITIONAL_IGNORE_DIRS}  # Additional directories to ignore
      - ADDITIONAL_IGNORE_FILES=${ADDITIONAL_IGNORE_FILES:-containerd.log}  # Skip containerd.log (46-64MB) to prevent FTS index bloat
      - SCHEDULE_INTERVAL_SECONDS=${SCHEDULE_INTERVAL_SECONDS:-1800}
      - CLEANUP_KEEP_BUILDS=${CLEANUP_KEEP_BUILDS:-3}
      - HEALTHCHECK_MAX_AGE=${HEALTHCHECK_MAX_AGE:-300}  # Heartbeat staleness threshold (seconds)
      # Skip files larger than this during indexing (prevents OOM from large node logs)
      - MAX_INDEX_FILE_SIZE_MB=${MAX_INDEX_FILE_SIZE_MB:-20}
      # Daily restart to clear ChromaDB HNSW tombstones that don't release
      # memory on chunk delete. Hour is in the TZ below. -1 disables.
      - TZ=${TZ:-America/Los_Angeles}
      - RESTART_AT_HOUR=${RESTART_AT_HOUR:-2}
      # Backstop in case the hourly check is missed (default 7d). 0 disables.
      # The daily RESTART_AT_HOUR is the primary trigger; this only catches
      # the case where it somehow doesn't fire for a week.
      - MAX_LIFETIME_SECONDS=${MAX_LIFETIME_SECONDS:-604800}
      # Memory instrumentation. Default off; enable temporarily to diagnose OOM.
      # MEMORY_MONITOR_INTERVAL_SECONDS=10 logs RSS every 10s.
      # TRACE_MEMORY=true also enables tracemalloc (top Python allocators per phase).
      - MEMORY_MONITOR_INTERVAL_SECONDS=${MEMORY_MONITOR_INTERVAL_SECONDS:-0}
      - TRACE_MEMORY=${TRACE_MEMORY:-false}
      # Use the model pre-downloaded into the image at build time — prevents 2-minute HF Hub startup checks
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 12g
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s  # Allow 3 minutes for initial startup/indexing
